[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle / pyflakes
  "B",                # flake8-bugbear
  "UP",               # pyupgrade
  "I",                # isort
  "C4",               # flake8-comprehensions
  "SIM",              # flake8-simplify
  "ARG",              # flake8-unused-arguments
  "PTH",              # flake8-use-pathlib
  "TID",              # flake8-tidy-imports
  "DTZ",              # flake8-datetimez
  "RET",              # flake8-return
  "PERF",             # perflint
  "TRY",              # try/except best practices
  "PL",               # pylint-inspired rules
  "NPY",              # numpy-specific rules
  "RUF",              # Ruff-specific
  "D",                # pydocstyle
  "C90",              # mccabe complexity
  "T10",              # flake8-debugger
  "T20",              # flake8-print
]
ignore = [
    "RUF012", # Mutable class attributes without ClassVar
    "PLR0913", # Allow functions with many arguments
    "PLR0917", # Allow functions with many positional arguments
    "PLR2004", # Allow magic numbers
    "TRY003", # Allow custom exception messages

    # Allow missing docstrings; enforce style where present
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",

    # Recommended when using Ruff's formatter
    "W191",
    "E111", "E114", "E117",
    "D206", "D300",
    "Q000", "Q001", "Q002", "Q003",
    "COM812", "COM819",
    "ISC001", "ISC002",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
lines-between-types = 1

[tool.ruff.lint.per-file-ignores]
# asv hashes each benchmark method and its setup into the benchmark version, so lint fixes inside them would
# reset that benchmark's recorded history.
"benchmarks/**" = [
    "ARG002",  # asv passes every parameter to every benchmark method
    "PLC0415", # gEconpy is imported lazily so asv can discover benchmarks without it installed
    "TID252",  # relative imports, several inside hashed setup bodies
]
"benchmarks/crossover/bench_core.py" = [
    "D401",    # time_build_solve's docstring is hashed and carries 145 recorded points
]
"scripts/*" = [
    "T201",    # command-line progress output
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
xfail_strict = true
